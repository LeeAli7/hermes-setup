model:
  default: deepseek-v4.1-flash-free
  provider: custom
  base_url: http://127.0.0.1:9000/zen/v1
  # Upstream /zen/v1/models reports limit.context=200000, limit.output=32000.
  context_length: 200000
  # opencode-zen demands OPENCODE_ZEN_API_KEY for models outside Hermes'
  # built-in allowlist -> AuthError. `custom` (was `opencode-free`) points at
  # the same keyless local Zen relay.
  # supports_vision: models.dev doesn't know the local relay alias and
  # returns unknown -> gateway falls back to text-stub vision mode.
  # Force native so photos go straight to the main model.
  supports_vision: true
# 2026-10-17: when opencode's Tor exits burn (403 wall), the agent fails over
# to kilo (127.0.0.1:9001) instead of dying mid-turn.
fallback_providers:
  - provider: kilo
    model: kilo-auto/free
provider: custom
toolsets:
- hermes-cli
platform_toolsets:
  telegram:
  - hermes-telegram
terminal:
  backend: local
  timeout: 180
telegram:
  reactions: false
display:
  streaming: true
  language: ru
  interface: cli
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
