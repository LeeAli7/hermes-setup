[Service]
# Idle watchdog OFF (0): vision turns reason silently for minutes (no SSE
# frames) on heavy image contexts, and any fixed threshold keeps killing
# healthy streams (60s default, then 180s — still hit). Backstops remain:
# TTFB 120s (pre-first-byte), wall-clock stale timeout, hard ceiling 1500s.
# Upstream hermes docs explicitly support 0 here and describe this exact
# symptom (vision-inflated request, worker idle).
# 2026-09-25: subagents dying with "did not emit a terminal response".
# NOTE: hermes regenerates hermes-gateway.service itself — keep custom env
# in this drop-in, never in the main unit file.
Environment=HERMES_CODEX_EVENT_STALE_TIMEOUT_SECONDS=0
